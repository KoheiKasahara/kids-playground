name: Nightly Full Test

on:
  schedule:
    # 03:00 JST (UTC 18:00) — 通常CI（test:quick）から外した slow テストを含む全件を毎日確認する。
    - cron: '0 18 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  # 既定は読み取りのみ。Nightly/Deploy の直近状態を取得するための Actions API 読み取り権限を含む。
  # Project Health 履歴（Issue #525）を書き込む権限は、依存パッケージのコードを実行しない
  # history job にだけ付与する（下記）。
  contents: read
  actions: read

jobs:
  full:
    runs-on: ubuntu-24.04
    steps:
      # npm ci 以降は依存パッケージのコードを実行するため、トークンを .git/config に残さない。
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        shell: bash
        run: |
          start=$(date +%s)
          set +e
          npm run lint
          status=$?
          end=$(date +%s)
          echo "duration=$((end - start))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Test (full, including slow, with coverage)
        id: test
        shell: bash
        run: |
          start=$(date +%s)
          set +e
          npm run test:full -- --coverage --coverage.reporter=text-summary --coverage.reporter=json-summary --reporter=default --reporter=json --outputFile=vitest-results.json
          status=$?
          end=$(date +%s)
          echo "duration=$((end - start))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Build
        id: build
        shell: bash
        run: |
          start=$(date +%s)
          set +e
          npm run build
          status=$?
          end=$(date +%s)
          echo "duration=$((end - start))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Ensure Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Test (Nightly E2E route smoke)
        id: e2e
        shell: bash
        env:
          # Project Health Dashboard（Issue #523）が対象ゲーム数/成功数を再利用できるよう、
          # 既存のNightly実行そのものからJSONレポートも出力する（追加のテスト実行はしない）。
          PLAYWRIGHT_JSON_OUTPUT_NAME: project-health-e2e-nightly.json
        run: |
          start=$(date +%s)
          set +e
          npm run test:e2e:nightly -- --reporter=line,json
          status=$?
          end=$(date +%s)
          echo "duration=$((end - start))" >> "$GITHUB_OUTPUT"
          echo "Nightly E2E route smoke duration: $((end - start))s"
          exit "$status"

      # trace/screenshotはPlaywright側で失敗時だけ生成する。retry成功時も初回失敗の証跡を残す。
      - name: Prepare bounded failure diagnostics
        if: always() && !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure')
        run: node scripts/e2e/prepare-diagnostics.mjs
      - name: Upload failed Nightly E2E diagnostics
        if: always() && !cancelled() && (steps.e2e.outcome == 'success' || steps.e2e.outcome == 'failure')
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: nightly-e2e-failures-${{ github.run_attempt }}
          path: e2e-diagnostics/
          retention-days: 3
          if-no-files-found: ignore

      - name: Upload Nightly E2E report for Project Health
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: project-health-e2e-nightly
          path: project-health-e2e-nightly.json
          retention-days: 14
          if-no-files-found: ignore

      # Project Health Dashboard（Issue #524）向けの Lighthouse 計測。
      # 通常PR CIには含めず、Nightly / 手動 Full Test でのみ実行する。
      # 対象ページは `.project-health.json` の lighthouse.targets に集約されている。
      # 計測に失敗しても Nightly 自体は失敗させず（continue-on-error）、
      # Project Health Summary 側は N/A（—/❓）として安全に表示する。
      - name: Project Health - run Lighthouse
        if: always()
        continue-on-error: true
        run: node scripts/project-health/run-lighthouse.mjs

      - name: Upload Lighthouse report for Project Health
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: project-health-lighthouse-nightly
          path: project-health/lighthouse-summary.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Write CI Summary
        if: always()
        env:
          CI_TEST_MODE: FULL / NIGHTLY
          CI_TEST_RESULTS_FILE: vitest-results.json
          CI_COVERAGE_FILE: coverage/coverage-summary.json
          CI_LINT_DURATION: ${{ steps.lint.outputs.duration }}
          CI_TEST_DURATION: ${{ steps.test.outputs.duration }}
          CI_BUILD_DURATION: ${{ steps.build.outputs.duration }}
          CI_LINT_OUTCOME: ${{ steps.lint.outcome }}
          CI_TEST_OUTCOME: ${{ steps.test.outcome }}
          CI_BUILD_OUTCOME: ${{ steps.build.outcome }}
          CI_NODE_VERSION: ${{ steps.setup-node.outputs.node-version }}
          CI_PACKAGE_MANAGER: npm
          CI_CACHE: setup-node npm cache
        run: node scripts/ci-summary.mjs

      # ここから Project Health Dashboard 履歴保存（Issue #525）。
      # このNightly実行自身が生成した成果物（vitest / dist / e2e / lighthouse）を
      # 再利用するだけで、履歴保存のための追加テスト・追加計測は行わない。
      - name: Project Health - dependency audit
        if: always()
        continue-on-error: true
        run: |
          mkdir -p project-health
          npm audit --json > project-health/npm-audit.json 2>/dev/null || true

      - name: Project Health - fetch Nightly / Deploy status
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/project-health/fetch-github-context.mjs

      # main は PR と build check を必須にしているため、履歴は専用ブランチに保存する。
      # 前回値を復元してから当日分を追記し、Dashboard はこのブランチの raw JSON を読む。
      # 公開リポジトリのため認証なしで取得できる。ブランチが無い場合（終了コード2）だけ
      # リポジトリ内の初期値から始め、通信・認証の失敗では止める（初期値で履歴を上書きしないため）。
      - name: Project Health - restore history
        id: restore-history
        if: always()
        shell: bash
        run: |
          status=0
          git ls-remote --exit-code --heads origin project-health-history >/dev/null || status=$?
          case "$status" in
            0)
              git fetch --no-tags origin project-health-history:refs/remotes/origin/project-health-history
              git show origin/project-health-history:public/project-health/history.json > public/project-health/history.json
              ;;
            2)
              echo "No existing Project Health history branch; starting from the repository seed."
              ;;
            *)
              echo "::error::Failed to query the project-health-history branch (git ls-remote exit status $status)."
              exit "$status"
              ;;
          esac

      # 復元に失敗した場合は書き込みも受け渡しもせず、history job でも保存させない。
      - name: Project Health - write history
        if: always() && steps.restore-history.outcome == 'success'
        env:
          PROJECT_HEALTH_NIGHTLY_LINT_OUTCOME: ${{ steps.lint.outcome }}
          PROJECT_HEALTH_NIGHTLY_TEST_OUTCOME: ${{ steps.test.outcome }}
          PROJECT_HEALTH_NIGHTLY_BUILD_OUTCOME: ${{ steps.build.outcome }}
          PROJECT_HEALTH_NIGHTLY_E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: node scripts/project-health/write-history.mjs

      # コミットと push は書き込み権限を持つ history job が行う。この job は成果物として渡すだけ。
      - name: Project Health - upload history
        if: always() && steps.restore-history.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: project-health-history
          path: public/project-health/history.json
          retention-days: 1
          if-no-files-found: error

  # 履歴の保存だけを担う job。contents: write はここにだけ付与する。
  # full job は npm ci・テスト・build・Lighthouse などで依存パッケージのコードを実行するため、
  # 書き込み可能なトークンを渡さない。この job は checkout・成果物の受け取り・git 操作だけを行い、
  # npm やリポジトリ内のスクリプトを実行しない。
  history:
    needs: full
    # テストが失敗した日も履歴を残す（従来の if: always() と同じ）。キャンセル時は保存しない。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Project Health - download history
        uses: actions/download-artifact@v8
        with:
          name: project-health-history
          path: ${{ runner.temp }}/project-health-history

      # 履歴は専用の project-health-history ブランチへ fast-forward push する。
      # main の ruleset を迂回せず、履歴保存に失敗した場合も握りつぶさない。
      - name: Project Health - commit history
        shell: bash
        run: |
          history_file=public/project-health/history.json
          history_copy="$RUNNER_TEMP/project-health-history/history.json"

          status=0
          git ls-remote --exit-code --heads origin project-health-history >/dev/null || status=$?
          case "$status" in
            0)
              git fetch --no-tags origin project-health-history:refs/remotes/origin/project-health-history
              git switch --force-create project-health-history origin/project-health-history
              ;;
            2)
              git switch --create project-health-history
              ;;
            *)
              echo "::error::Failed to query the project-health-history branch (git ls-remote exit status $status)."
              exit "$status"
              ;;
          esac
          cp "$history_copy" "$history_file"

          if [ -z "$(git status --porcelain "$history_file")" ]; then
            echo "No history changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$history_file"
          git commit -m "chore(project-health): update history $(date -u +%Y-%m-%d)"
          git push origin HEAD:project-health-history
