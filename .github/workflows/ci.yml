name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        shell: bash
        run: |
          start=$(date +%s)
          set +e
          npm run lint
          status=$?
          end=$(date +%s)
          echo "duration=$((end - start))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Test (quick)
        id: test
        shell: bash
        run: |
          start=$(date +%s)
          set +e
          npm run test:quick -- --reporter=default --reporter=json --outputFile=vitest-results.json
          status=$?
          end=$(date +%s)
          echo "duration=$((end - start))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Build
        id: build
        shell: bash
        run: |
          start=$(date +%s)
          set +e
          npm run build
          status=$?
          end=$(date +%s)
          echo "duration=$((end - start))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Write CI Summary
        if: always()
        env:
          CI_TEST_MODE: QUICK CI
          CI_TEST_RESULTS_FILE: vitest-results.json
          CI_LINT_DURATION: ${{ steps.lint.outputs.duration }}
          CI_TEST_DURATION: ${{ steps.test.outputs.duration }}
          CI_BUILD_DURATION: ${{ steps.build.outputs.duration }}
          CI_LINT_OUTCOME: ${{ steps.lint.outcome }}
          CI_TEST_OUTCOME: ${{ steps.test.outcome }}
          CI_BUILD_OUTCOME: ${{ steps.build.outcome }}
          CI_NODE_VERSION: '22'
          CI_PACKAGE_MANAGER: npm
          CI_CACHE: setup-node npm cache
        run: node scripts/ci-summary.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
