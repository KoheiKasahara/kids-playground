name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Project Health Dashboard が Nightly / Deploy の直近結果を GitHub Actions API
      # から読み取るために必要な最小権限（書き込みは行わない）。
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        shell: bash
        run: |
          start=$(date +%s)
          set +e
          npm run lint
          status=$?
          end=$(date +%s)
          echo "duration=$((end - start))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Test (quick)
        id: test
        shell: bash
        run: |
          start=$(date +%s)
          set +e
          npm run test:quick -- --reporter=default --reporter=json --outputFile=vitest-results.json
          status=$?
          end=$(date +%s)
          echo "duration=$((end - start))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Build
        id: build
        shell: bash
        run: |
          start=$(date +%s)
          set +e
          npm run build
          status=$?
          end=$(date +%s)
          echo "duration=$((end - start))" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Ensure Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Test (E2E smoke)
        id: e2e
        shell: bash
        run: |
          start=$(date +%s)
          set +e
          npm run test:e2e
          status=$?
          end=$(date +%s)
          echo "duration=$((end - start))" >> "$GITHUB_OUTPUT"
          echo "E2E smoke duration: $((end - start))s"
          exit "$status"

      - name: Write CI Summary
        if: always()
        env:
          CI_TEST_MODE: QUICK CI
          CI_TEST_RESULTS_FILE: vitest-results.json
          CI_LINT_DURATION: ${{ steps.lint.outputs.duration }}
          CI_TEST_DURATION: ${{ steps.test.outputs.duration }}
          CI_BUILD_DURATION: ${{ steps.build.outputs.duration }}
          CI_LINT_OUTCOME: ${{ steps.lint.outcome }}
          CI_TEST_OUTCOME: ${{ steps.test.outcome }}
          CI_BUILD_OUTCOME: ${{ steps.build.outcome }}
          CI_NODE_VERSION: '22'
          CI_PACKAGE_MANAGER: npm
          CI_CACHE: setup-node npm cache
        run: node scripts/ci-summary.mjs

      # ここから Project Health Dashboard（Issue #523）。
      # 既存の quick test / build の成果物と、Nightly / Deploy ワークフローの
      # 直近実行結果を再利用するだけで、通常CIのためのテスト・buildの再実行は行わない。
      - name: Project Health - fetch Nightly / Deploy status
        id: project-health-context
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/project-health/fetch-github-context.mjs

      - name: Project Health - download Nightly E2E smoke report
        if: always() && steps.project-health-context.outputs.nightly_run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: project-health-e2e-nightly
          run-id: ${{ steps.project-health-context.outputs.nightly_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: project-health/nightly-e2e

      - name: Project Health - dependency audit
        if: always()
        continue-on-error: true
        run: |
          mkdir -p project-health
          npm audit --json > project-health/npm-audit.json 2>/dev/null || true

      - name: Project Health - write summary
        if: always()
        run: node scripts/project-health/generate-summary.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
